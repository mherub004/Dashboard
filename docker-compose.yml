services:
  agent:
    build: .
    container_name: northstar-agent
    restart: unless-stopped
    env_file: .env
    network_mode: host
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the group owning /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
